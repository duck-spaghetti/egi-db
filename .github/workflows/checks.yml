name: EGI development checks
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    name: EGI / database
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EGI_DEVTOOLS_SOURCE: ${{ github.workspace }}/.local/devtools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Resolve exact canonical tooling
        id: tools
        run: python -c "import json,os; p=json.load(open('.checks/tool-source.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('revision='+p['revision']+'\n')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: duck-spaghetti/egi-app
          ref: ${{ steps.tools.outputs.revision }}
          path: .local/devtools
          persist-credentials: false
      - name: Install selected PostgreSQL18/PostGIS and Sqitch prerequisites
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-18 postgresql-18-postgis-3 sqitch libdbd-pg-perl
          sudo install -d -m 1777 /private/tmp
          echo 'EGI_PG_BIN=/usr/lib/postgresql/18/bin' >> "$GITHUB_ENV"
          echo 'EGI_SQITCH=/usr/bin/sqitch' >> "$GITHUB_ENV"
          /usr/lib/postgresql/18/bin/postgres --version
          sqitch --version
          df -h /private/tmp
      - name: Validate actual PR commit objects
        env:
          EGI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/commit_guard.py range "$EGI_BASE_SHA" HEAD
      - name: Run owning Complete profile
        run: python scripts/check.py --profile complete --json > .local/ci-report.json
      - name: Retain identified reports and artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-${{ github.event.pull_request.head.sha }}
          path: |
            .local/ci-report.json
            .local/native-last.log
            .local/resource-last-failure.json
          if-no-files-found: error
